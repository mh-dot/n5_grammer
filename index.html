<style>

<p>প্রতিটি কার্ডে নিয়ম, গঠন, টিপ এবং উদাহরণ আছে। উদাহরণে ফুরিগানা, হিরাগানা, রোমাজি, বাংলা উচ্চারণ ও অর্থ দেওয়া। 🔊 চাপলে শুনতে পাবেন।</p>

<script>
/* L|নং|শিরোনাম  G|প্যাটার্ন|নাম|গঠন|ব্যাখ্যা|টিপ  E|বাক্য[পড়া]|অর্থ */
const D=`L|1|পাঠ ১ · পরিচয় দেওয়া
G|A は B です|“A হলো B” (পরিচয়)|A は B です|は (পড়ুন “ওয়া”) কথার বিষয় বোঝায়, です বাক্যকে ভদ্রভাবে শেষ করে। বাংলার মতোই ক্রিয়া শেষে বসে।|は লেখা হয় “হা”, কিন্তু পড়া হয় “ওয়া”।
E|私[わたし] は 学生[がくせい] です。|আমি ছাত্র।
E|マイク さん は アメリカ人[じん] です。|মাইক আমেরিকান।
G|A は B じゃ ありません|“A হলো B নয়” ও প্রশ্ন|A は B じゃ ありません / ～です か|です এর না-বোধক রূপ じゃ ありません (লেখায় ではありません)। প্রশ্ন করতে শেষে か বসান, প্রশ্নচিহ্ন লাগে না।|はい = হ্যাঁ, いいえ = না।
E|私[わたし] は 先生[せんせい] じゃ ありません。|আমি শিক্ষক নই।
E|あなた は 学生[がくせい] です か。|আপনি কি ছাত্র?
E|いいえ、 学生[がくせい] じゃ ありません。|না, আমি ছাত্র নই।
G|も ও の|も = “-ও”, の = “-এর”|A も B です / A の B|も আগের কথার সাথে মিল বোঝায় (は এর জায়গায় বসে)। の দুই বিশেষ্য জুড়ে মালিকানা বা সম্পর্ক বোঝায়।|の অনেকটা বাংলার “-র/-এর”।
E|私[わたし] も 学生[がくせい] です。|আমিও ছাত্র।
E|先生[せんせい] の 名前[なまえ] は ミラー です。|শিক্ষকের নাম মিলার।
L|2|পাঠ ২ · জিনিস দেখিয়ে বলা
G|これ・それ・あれ|“এটা・ওটা・ঐটা”|これ/それ/あれ は N です|これ = বক্তার কাছে, それ = শ্রোতার কাছে, あれ = দুজনেরই দূরে। “কী” জিজ্ঞেস করতে 何[なん] ব্যবহার হয়।|それ মানে আপনার দিকের নয়, শ্রোতার দিকের জিনিস।
E|これ は 本[ほん] です。|এটা বই।
E|それ は 何[なん] です か。|ওটা কী?
E|あれ は 私[わたし] の かさ です。|ঐটা আমার ছাতা।
G|この・その・あの|“এই・ওই・ঐ + বিশেষ্য”|この/その/あの N は ～ です|これ-দলের শব্দ একা বসে, কিন্তু この-দলের পরে সবসময় একটি বিশেষ্য লাগে।|この 本 ঠিক, কিন্তু “この です” ভুল।
E|この 本[ほん] は 私[わたし] の です。|এই বইটা আমার।
E|あの 人[ひと] は だれ です か。|ঐ লোকটি কে?
G|そう です・A か B か|“তাই” ও “A নাকি B?”|そう です / そう じゃ ありません|প্রশ্নের উত্তরে そう です (তাই) বা そう じゃ ありません (তা নয়)। দুই বিকল্প থেকে বাছতে か দুইবার বসে।|উত্তরে সরাসরি B বলে দেওয়াই স্বাভাবিক।
E|これ は 本[ほん] です か、 ノート です か。|এটা বই নাকি খাতা?
E|ノート です。|খাতা।
E|いいえ、 そう じゃ ありません。|না, তা নয়।
L|3|পাঠ ৩ · স্থান
G|ここ・そこ・あそこ・どこ|“এখানে・ওখানে・ঐখানে・কোথায়”|N は ここ/そこ/あそこ です|স্থান বোঝায়: ここ (আমার কাছে), そこ (আপনার কাছে), あそこ (দূরে)। জিজ্ঞেস করতে どこ।|প্যাটার্ন: জিনিস は স্থান です।
E|ここ は 教室[きょうしつ] です。|এটা ক্লাসরুম।
E|トイレ は どこ です か。|টয়লেট কোথায়?
E|トイレ は あそこ です。|টয়লেট ঐখানে।
G|こちら・そちら・あちら・どちら|“এদিক…” (ভদ্র রূপ)|こちら は N さん です|ここ-র ভদ্র রূপ। মানুষের পরিচয় করাতে (ইনি…) এবং দিক বা দেশ জিজ্ঞেস করতে ব্যবহার হয়।|অতিথি বা অফিসে こちら ব্যবহার করুন।
E|こちら は 山田[やまだ] さん です。|ইনি ইয়ামাদা-সান।
E|お 国[くに] は どちら です か。|আপনার দেশ কোথায়?
G|の দিয়ে উৎস|“…র তৈরি / …কার”|N1 の N2|の দিয়ে কোন দেশ বা কোম্পানির জিনিস তা বলা যায়। প্রশ্নে どこ の (কোথাকার) ব্যবহার হয়।|どこ の = কোথাকার।
E|これ は 日本[にほん] の 車[くるま] です。|এটা জাপানের গাড়ি।
E|その かばん は どこ の です か。|ওই ব্যাগ কোথাকার?
L|4|পাঠ ৪ · সময় ও ক্রিয়া (ます)
G|今 何時ですか|“এখন কয়টা”|今 ～時 ～分 です|সময়: সংখ্যা + 時 (ঘণ্টা) + 分 (মিনিট)। প্রশ্ন: 何時[なんじ] (কয়টা)। 半[はん] মানে আধা।|4 = よじ, 7 = しちじ, 9 = くじ, এগুলো নিয়মের বাইরে।
E|今[いま] 何時[なんじ] です か。|এখন কয়টা বাজে?
E|今[いま] 九時[くじ] 半[はん] です。|এখন সাড়ে নয়টা।
G|V ます・ません・ました|ক্রিয়ার ভদ্র চার রূপ|ます / ません / ました / ませんでした|ます = হ্যাঁ (বর্তমান/ভবিষ্যৎ), ません = না, ました = হ্যাঁ (অতীত), ませんでした = না (অতীত)। শুধু শেষ অংশ বদলায়।|ます দিয়ে শেষ হলে বুঝবেন ভদ্র রূপ।
E|毎朝[まいあさ] 六時[ろくじ] に 起[お]きます。|প্রতিদিন সকালে ছয়টায় উঠি।
E|昨日[きのう] 勉強[べんきょう] しました。|গতকাল পড়েছি।
E|今日[きょう] は 勉強[べんきょう] しません。|আজ পড়ব না।
G|に ও から〜まで|“সময়ে” ও “…থেকে…পর্যন্ত”|時間 に V / A から B まで|নির্দিষ্ট সময়ে কাজ হলে に বসে। কাজ কখন শুরু ও শেষ তা বলতে から (থেকে) ও まで (পর্যন্ত)।|“আজ, গতকাল” এর পরে に লাগে না।
E|七時[しちじ] に 起[お]きます。|সাতটায় উঠি।
E|九時[くじ] から 五時[ごじ] まで 働[はたら]きます。|নয়টা থেকে পাঁচটা কাজ করি।
L|5|পাঠ ৫ · যাওয়া, আসা, ফেরা
G|へ + 行く・来る・帰る|“…-তে যাই/আসি/ফিরি”|場所 へ 行[い]きます|গন্তব্য বোঝায় へ (লেখা “হে”, পড়া “এ”)। 行[い]きます = যাই, 来[き]ます = আসি, 帰[かえ]ります = ফিরি।|は এর মতো へ এরও লেখা আর পড়া আলাদা।
E|学校[がっこう] へ 行[い]きます。|স্কুলে যাই।
E|日本[にほん] へ 来[き]ました。|জাপানে এসেছি।
E|家[うち] へ 帰[かえ]ります。|বাড়ি ফিরি।
G|で (যানবাহন)|“…দিয়ে / …-তে করে”|乗り物 で 行[い]きます|যানবাহনের পরে で বসে। প্রশ্ন: 何[なに] で (কিসে)। হেঁটে গেলে で লাগে না: 歩[ある]いて 行きます।|で = উপায় বা মাধ্যম।
E|電車[でんしゃ] で 会社[かいしゃ] へ 行[い]きます。|ট্রেনে অফিস যাই।
E|何[なに] で 来[き]ました か。|কিসে করে এসেছেন?
G|と ও いつ|“…র সাথে” ও “কখন”|人 と V / いつ V|と সঙ্গী বোঝায়, প্রশ্নে だれ と (কার সাথে)। いつ = কখন, এর পরে に লাগে না।|একা গেলে ひとり で।
E|友達[ともだち] と 学校[がっこう] へ 行[い]きます。|বন্ধুর সাথে স্কুলে যাই।

const ROWS=[['','','あいうえお'],['k','ক','かきくけこ'],['s','স','さしすせそ'],['t','ত','たちつてと'],['n','ন','なにぬねの'],['h','হ','はひふへほ'],['m','ম','まみむめも'],['r','র','らりるれろ'],['g','গ','がぎぐげご'],['z','জ','ざじずぜぞ'],['d','দ','だぢづでど'],['b','ব','ばびぶべぼ'],['p','প','ぱぴぷぺぽ']];
const V='aiueo',BV='আইউএও',BS=['া','ি','ু','ে','ো'],M={},Y={'ゃ':0,'ゅ':2,'ょ':4};
ROWS.forEach(([c,b,s])=>[...s].forEach((k,i)=>M[k]=c?[c+V[i],b+BS[i]]:[V[i],BV[i]]));
Object.assign(M,{し:['shi','শি'],ち:['chi','চি'],つ:['tsu','তসু'],ふ:['fu','ফু'],じ:['ji','জি'],ぢ:['ji','জি'],づ:['zu','জু'],や:['ya','ইয়া'],ゆ:['yu','ইউ'],よ:['yo','ইয়ো'],わ:['wa','ওয়া'],を:['o','ও'],ん:['n','ন']});
const PART={'は':['wa','ওয়া'],'へ':['e','এ'],'を':['o','ও']},PUN={'。':'.','、':',','・':' '};
const hira=c=>{const k=c.charCodeAt(0);return k>=0x30A1&&k<=0x30F6?String.fromCharCode(k-0x60):c};
function conv(txt){
  const R=[],B=[];
  txt.split(' ').forEach(w=>{
    if(PART[w]){R.push(PART[w][0]);B.push(PART[w][1]);return}
    let rr='',bb='',prev=null,sm=false;
    for(let ch of w){
      ch=hira(ch);
      if(ch==='っ'){sm=true;continue}
      if(ch==='ー'){rr+=rr.slice(-1);continue}
      if(PUN[ch]){rr+=PUN[ch];bb+=PUN[ch];continue}
      if(ch in Y&&prev){
        const [r,b]=prev,v=Y[ch],sh=/^(sh|ch|j)/.test(r);
        rr=rr.slice(0,-r.length);bb=bb.slice(0,-b.length);
        const nr=r.slice(0,-1)+(sh?'':'y')+V[v],nb=b.slice(0,-1)+(sh?'':'্য')+BS[v];
        rr+=nr;bb+=nb;prev=[nr,nb];continue}
      const m=M[ch];
      if(!m){rr+=ch;bb+=ch;continue}
      let [r,b]=m;const lv=rr.slice(-1);
      if(r.length===1&&V.includes(r)&&(r===lv||(r==='u'&&lv==='o')||(r==='i'&&lv==='e'))){rr+=r;continue}
      if(sm){r=(r[0]==='c'?'t':r[0])+r;b=b[0]+'্'+b;sm=false}
      rr+=r;bb+=b;prev=[r,b];
    }
    R.push(rr);B.push(bb);
  });
  return [R.join(' '),B.join(' ')];
}

let gender='f',rate=.8;
const MALE=/ichiro|otoya|hattori|keita|takumi|daichi|naoki|ryota|male|男/i;
function pick(){
  const ja=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(x=>x.lang.toLowerCase().replace('_','-').startsWith('ja'));
  const m=ja.find(x=>MALE.test(x.name)),f=ja.find(x=>!MALE.test(x.name))||ja[0];

}
function say(t,btn){
  const s=window.speechSynthesis;

  s.cancel();document.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));

  u.onstart=()=>btn.classList.add('on');u.onend=()=>btn.classList.remove('on');

    c.innerHTML=`<span class="tag">পাঠ ${ln} · নিয়ম ${gn}</span><h3 lang="ja">${p[1]}</h3><p class="nm">${p[2]}</p><div class="fm"><b>গঠন</b>${p[3]}</div><p class="ex-t">${p[4]}</p><p class="tip">💡 ${p[5]}</p><div class="exs"></div>`;
    grid.appendChild(c);exs=c.querySelector('.exs');
  }else if(p[0]==='E'){
    const h=kana(p[1]),[ro,bn]=conv(h);
    const e=document.createElement('div');e.className='ex';
    e.innerHTML=`<button class="sp" aria-label="শুনুন">🔊</button><div class="jp" lang="ja">${ru(p[1])}</div><div class="hi" lang="ja">${h}</div><div class="ro">${ro}</div><div class="bn">${bn}</div><div class="mn">${p[2]}</div>`;
    const b=e.querySelector('.sp');b.onclick=()=>say(h,b);
    exs.appendChild(e);
  }
});

/* লেসন বক্স ↔ পাঠ দেখানো */
history.scrollRestoration='manual';
let homeY=0;
document.getElementById('nav').addEventListener('click',()=>{homeY=window.scrollY});
function route(){
  const s=location.hash.length>1?document.getElementById(location.hash.slice(1)):null;
  document.querySelectorAll('section').forEach(x=>x.classList.toggle('show',x===s));
  document.getElementById('home').hidden=!!s;
  window.scrollTo({top:s?Math.max(0,s.getBoundingClientRect().top+window.scrollY-12):homeY,behavior:'instant'});
}
addEventListener('hashchange',route);route();
</script>
